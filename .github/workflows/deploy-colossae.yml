name: Deploy Colossae to GitHub Pages

on:
  push:
    branches: [claude/awesome-shannon-08rxxx, main]
    paths: [colossae/**]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: colossae/package-lock.json

      - name: Install
        run: npm ci
        working-directory: colossae

      - name: Build
        run: npm run build
        working-directory: colossae

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: colossae/dist

      - uses: actions/deploy-pages@v4
        id: deployment
